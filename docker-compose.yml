# Postgres for AskKendal. pgvector image so the later "ask" feature can add embeddings without a new database.
# Port 5433 on the host to avoid clashing with any local Postgres on 5432.
services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: askkendal
      POSTGRES_PASSWORD: askkendal
      POSTGRES_DB: askkendal
    ports:
      - "5433:5432"
    volumes:
      - askkendal-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U askkendal"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  askkendal-db:
